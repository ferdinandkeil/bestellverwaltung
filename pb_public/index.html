<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Labor-Bestellsystem</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="paper min-h-dvh text-slate-900 antialiased">
  <!-- Hintergrund (Experiment): Kaffeeflecken und Bauteile am Rand, rein dekorativ -->
  <div class="paper-decor" aria-hidden="true">
    <img src="assets/papier/kaffee-ring.svg" alt="" class="paper-ring-1">
    <img src="assets/papier/kaffee-ring.svg" alt="" class="paper-ring-2">
    <img src="assets/papier/kaffee-tropfen.svg" alt="" class="paper-drops">
    <img src="assets/papier/widerstand.svg" alt="" class="paper-part paper-resistor">
    <img src="assets/papier/led.svg" alt="" class="paper-part paper-led">
    <img src="assets/papier/ic.svg" alt="" class="paper-part paper-ic">
    <img src="assets/papier/elko.svg" alt="" class="paper-part paper-cap">
    <img src="assets/papier/transistor.svg" alt="" class="paper-part paper-transistor">
  </div>
  <!-- Spalte über die ganze Höhe: die Fußzeile steht auch bei kurzen Seiten unten -->
  <div x-data x-cloak class="flex min-h-dvh flex-col">
    <!-- Kopfzeile (nur eingeloggt) -->
    <header x-show="$store.auth.user" class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="relative mx-auto flex max-w-6xl items-center gap-1 px-4 py-2" x-data="{ menu: false }"
           @keydown.escape.window="menu = false" @click.outside="menu = false" @hashchange.window="menu = false">
        <a href="#/" class="mr-auto text-base font-semibold text-blue-700 sm:mr-4">Labor-Bestellungen</a>
        <!-- ab sm: Navigation in der Kopfzeile -->
        <nav class="hidden flex-1 items-center gap-1 text-sm sm:flex">
          <a href="#/" class="rounded-lg px-2.5 py-1.5"
             :class="['dashboard','order'].includes($store.route.name) ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-600 hover:bg-slate-100'">Bestellungen</a>
          <a href="#/groups" class="rounded-lg px-2.5 py-1.5"
             :class="$store.route.name === 'groups' ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-600 hover:bg-slate-100'">Gruppen/Projekte</a>
          <a href="#/favorites" class="rounded-lg px-2.5 py-1.5"
             :class="['favorites','favorite'].includes($store.route.name) ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-600 hover:bg-slate-100'">Favoriten</a>
        </nav>
        <!-- Modul-Symbole (Slot header-actions) und Warenkorb-Symbol mit Ausklappfeld (views/cart-menu.js, beim Start eingesetzt) -->
        <div id="header-actions"></div>
        <div id="cart-menu" class="mr-1 hidden sm:block"></div>
        <span class="hidden text-xs text-slate-500 md:inline" x-text="$store.auth.user?.name || $store.auth.user?.email"></span>
        <button type="button" class="btn btn-ghost btn-sm hidden sm:inline-flex" @click="$store.auth.logout()">Logout</button>

        <!-- Smartphone: Hamburger-Menü mit Navigation und Logout -->
        <button type="button" class="-mr-2 rounded-lg p-2 text-slate-700 hover:bg-slate-100 sm:hidden" @click="menu = !menu"
                :aria-expanded="menu" aria-controls="mobile-menu" :aria-label="menu ? 'Menü schließen' : 'Menü öffnen'" data-menu-button>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-6" aria-hidden="true">
            <path x-show="!menu" d="M4 7h16M4 12h16M4 17h16"/><path x-show="menu" d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
        <nav id="mobile-menu" x-show="menu" x-transition.origin.top data-mobile-menu
             class="absolute inset-x-0 top-full border-b border-slate-200 bg-white px-4 py-2 shadow-lg sm:hidden">
          <a href="#/" class="block rounded-lg px-3 py-3"
             :class="['dashboard','order'].includes($store.route.name) ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-700'">Bestellungen</a>
          <a href="#/groups" class="block rounded-lg px-3 py-3"
             :class="$store.route.name === 'groups' ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-700'">Gruppen/Projekte</a>
          <a href="#/favorites" class="block rounded-lg px-3 py-3"
             :class="['favorites','favorite'].includes($store.route.name) ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-700'">Favoriten</a>
          <div class="mt-2 flex items-center gap-2 border-t border-slate-100 px-3 pt-3 pb-1">
            <span class="mr-auto truncate text-sm text-slate-500" x-text="$store.auth.user?.name || $store.auth.user?.email"></span>
            <button type="button" class="btn btn-secondary btn-sm" @click="menu = false; $store.auth.logout()">Logout</button>
          </div>
        </nav>
      </div>
    </header>

    <!-- Aktuelle Ansicht (wird vom Router ein-/ausgehängt) -->
    <main id="view" class="mx-auto w-full max-w-6xl flex-1 px-4 pt-4 pb-8"></main>

    <!-- Fußzeile: volle Breite, leicht weiß abgesetzt, am Seitenende (scrollt mit). Version (version.json schreibt
         scripts/deploy.sh auf dem Server; im Repo leer = Entwicklungsstand) und Autor. Smartphone: Platz für den Warenkorb-Knopf. -->
    <footer class="w-full border-t border-slate-200 bg-white/70 pb-20 backdrop-blur-sm sm:pb-0" data-footer
            x-data="{ version: '' }"
            x-init="fetch('version.json').then((r) => r.json()).then((v) => { version = v.commit ? `Version ${v.date} (${v.commit})` : 'Entwicklungsstand'; }).catch(() => { version = ''; })">
      <div class="mx-auto max-w-6xl px-4 py-0.5 text-center text-xs leading-4 text-slate-500">
        Labor-Bestellsystem<span x-show="version"> · <span x-text="version"></span></span> · Ferdinand Keil
      </div>
    </footer>

    <!-- Formular „Position erfassen“ (views/cart-menu.js, Ereignis open-item-form) und Warenkorb-Knopf (Smartphone) -->
    <div id="item-form-modal"></div>
    <div id="cart-fab"></div>

    <!-- Tooltip (core/ui.js: x-tip) – Sprechblase mit Pfeil zum Element -->
    <div x-data x-show="$store.tooltip.text" x-cloak role="tooltip" data-tooltip
         class="pointer-events-none fixed z-[60] -translate-x-1/2 rounded-md bg-slate-900 px-2 py-1 text-xs font-medium whitespace-nowrap text-white shadow-lg"
         :class="$store.tooltip.below ? '' : '-translate-y-full'"
         :style="`left: ${$store.tooltip.x}px; top: ${$store.tooltip.y}px`">
      <span x-text="$store.tooltip.text"></span>
      <span class="absolute left-1/2 size-2 -translate-x-1/2 rotate-45 bg-slate-900"
            :class="$store.tooltip.below ? '-top-1' : '-bottom-1'" aria-hidden="true"></span>
    </div>

    <!-- Toasts (core/ui.js), auf dem Smartphone oberhalb des Warenkorb-Knopfs: Symbol + Meldung; Aktionen ab sm übereinander rechts daneben, auf dem Smartphone
         nebeneinander unter dem Text. Der Balken zeigt die Standzeit. -->
    <div class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-3 p-4 pb-24 sm:pb-4">
      <template x-for="t in $store.toasts.items" :key="t.id">
        <div class="pointer-events-auto relative flex w-full max-w-xl flex-wrap items-stretch overflow-hidden rounded-xl text-base text-white shadow-xl sm:flex-nowrap" data-toast
             :class="{ 'bg-slate-800': t.type === 'info', 'bg-emerald-700': t.type === 'success', 'bg-red-700': t.type === 'error' }">
          <div class="flex min-w-0 flex-1 basis-0 items-start gap-3 px-4 py-4 sm:px-5">
            <span class="mt-0.5 size-6 shrink-0" x-html="$store.toasts.icon(t.type)"></span>
            <span class="flex-1 leading-snug" x-text="t.message"></span>
          </div>
          <div class="order-last flex w-full justify-end gap-1 border-t border-white/20 px-2 py-1.5 sm:order-none sm:w-auto sm:shrink-0 sm:flex-col sm:justify-center sm:border-t-0 sm:border-l sm:py-2" x-show="t.actions.length">
            <template x-for="a in t.actions" :key="a.label">
              <button type="button" class="flex items-center gap-2 rounded-lg px-2 py-2 text-left text-sm font-semibold sm:px-3 whitespace-nowrap hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-white"
                      data-toast-action @click="$store.toasts.act(t, a)">
                <span class="size-5 shrink-0" x-html="$store.toasts.icon(a.icon)"></span>
                <span x-text="a.label"></span>
              </button>
            </template>
          </div>
          <button type="button" class="flex w-10 shrink-0 items-start justify-center pt-4 opacity-70 hover:opacity-100" @click="$store.toasts.dismiss(t.id)" aria-label="Schließen">
            <span class="size-5" x-html="$store.toasts.icon('close')"></span>
          </button>
          <div class="toast-progress absolute inset-x-0 bottom-0 h-1 origin-left bg-white/60" x-show="t.timeoutMs"
               :style="`animation-duration: ${t.timeoutMs}ms`"></div>
        </div>
      </template>
    </div>

    <!-- Sicherheitsabfrage (core/ui.js: confirmAction). Escape bleibt im Dialog, damit darunterliegende Modals offen bleiben. -->
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-message"
            @close="$store.confirm.settle($el.returnValue === 'ok')"
            @click="$event.target === $el && $el.close('cancel')"
            @keydown.escape.stop>
      <form method="dialog" class="p-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:p-6">
        <p id="confirm-message" class="whitespace-pre-line text-sm text-slate-800" x-text="$store.confirm.message"></p>
        <div class="mt-5 grid grid-cols-2 gap-2 sm:flex sm:justify-end">
          <button type="submit" value="cancel" class="btn btn-secondary py-2.5 sm:py-2" x-text="$store.confirm.cancelLabel"></button>
          <button type="submit" value="ok" class="btn py-2.5 sm:py-2" :class="$store.confirm.danger ? 'btn-danger-solid' : 'btn-primary'"
                  x-text="$store.confirm.confirmLabel"></button>
        </div>
      </form>
    </dialog>
  </div>

  <script type="module">
    import Alpine from './vendor/alpinejs@3.17.5/dist/module.esm.js';
    import { refreshSession, onAuthChange, logout } from './core/pb.js';
    import { initUiStore } from './core/ui.js';
    import { onPluginsChanged } from './core/plugin-registry.js';

    import loginView from './views/login-view.js';
    import dashboardView from './views/dashboard-view.js';
    import orderDetailView from './views/order-detail-view.js';
    import groupsView from './views/groups-view.js';
    import favoritesView from './views/favorites-view.js';
    import favoriteListView from './views/favorite-list-view.js';
    import { registerItemForm } from './views/item-form.js';
    import { registerUnmatchedReceipts } from './views/unmatched-receipts.js';
    import { registerOrderSteps } from './views/order-steps.js';
    import cartsView, { registerCartMenu, cartMenuTemplate, cartFabTemplate, headerActionsTemplate, itemFormModalTemplate } from './views/cart-menu.js';

    // Erweiterungsmodule (registrieren sich selbst über core/plugin-registry.js):
    const MODULES = [
      './modules/delivery-scanner/scanner-modal.js',
      './modules/moodle-import/moodle-importer.js',
      './modules/shop-export/shop-exporter.js',
      './modules/favorites/from-order.js',
    ];

    // Routen: Hash → View. ":id" wird als Parameter übergeben.
    const ROUTES = [
      { name: 'login', pattern: /^\/login$/, view: loginView, public: true },
      { name: 'dashboard', pattern: /^\/?$/, view: dashboardView },
      { name: 'order', pattern: /^\/orders\/([a-z0-9]{15})$/, view: orderDetailView, params: ['id'] },
      { name: 'carts', pattern: /^\/carts$/, view: cartsView },
      { name: 'groups', pattern: /^\/groups$/, view: groupsView },
      { name: 'favorites', pattern: /^\/favorites$/, view: favoritesView },
      { name: 'favorite', pattern: /^\/favorites\/([a-z0-9]{15})$/, view: favoriteListView, params: ['id'] },
    ];

    window.Alpine = Alpine;
    initUiStore();
    Alpine.store('auth', {
      user: null,
      logout() {
        logout();
        location.hash = '#/login';
      },
    });
    Alpine.store('route', { name: '', params: {} });
    Alpine.store('plugins', { version: 0 });
    onPluginsChanged(() => Alpine.store('plugins').version++);

    for (const v of ROUTES.map((r) => r.view)) Alpine.data(v.dataName, v.component);
    registerItemForm(Alpine);
    registerUnmatchedReceipts(Alpine);
    registerOrderSteps(Alpine);
    registerCartMenu();
    document.getElementById('header-actions').innerHTML = headerActionsTemplate;
    document.getElementById('cart-menu').innerHTML = cartMenuTemplate;
    document.getElementById('item-form-modal').innerHTML = itemFormModalTemplate;
    document.getElementById('cart-fab').innerHTML = cartFabTemplate;

    const main = document.getElementById('view');
    let mounted = null;

    function mount(route, params) {
      const store = Alpine.store('route');
      if (mounted === route && JSON.stringify(store.params) === JSON.stringify(params)) return;
      Alpine.destroyTree(main);
      store.name = route.name;
      store.params = params;
      Alpine.mutateDom(() => { main.innerHTML = route.view.template; });
      Alpine.initTree(main);
      mounted = route;
      window.scrollTo(0, 0);
    }

    function resolve() {
      const path = decodeURI(location.hash.replace(/^#/, '')) || '/';
      const user = Alpine.store('auth').user;
      for (const route of ROUTES) {
        const m = path.match(route.pattern);
        if (!m) continue;
        if (!route.public && !user) { location.replace('#/login'); return; }
        if (route.name === 'login' && user) { location.replace('#/'); return; }
        const params = Object.fromEntries((route.params ?? []).map((p, i) => [p, m[i + 1]]));
        mount(route, params);
        return;
      }
      location.replace('#/');
    }

    async function boot() {
      Alpine.start();
      Alpine.store('auth').user = await refreshSession();
      onAuthChange((user) => {
        Alpine.store('auth').user = user;
        if (!user) resolve();
      });
      for (const m of MODULES) {
        try { await import(m); } catch (err) { console.error('Modul konnte nicht geladen werden:', m, err); }
      }
      window.addEventListener('hashchange', resolve);
      resolve();
    }
    boot();
  </script>
</body>
</html>
